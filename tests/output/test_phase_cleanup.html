<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Phase Label &amp; Animation Cleanup Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    .message { border: 1px dashed #ccc; padding: 8px; margin: 8px 0; }
    .message .meta { font-weight: bold; margin-bottom: 4px; }
    .message .content { margin-top: 4px; }
    .streaming-step { padding: 4px; margin: 2px 0; }
    .streaming-step.running { background: #e8f4fd; }
    .streaming-cursor::after { content: "|"; animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <h1>Phase Label &amp; Animation Cleanup Tests</h1>
  <div id="testArea"></div>
  <div id="results"></div>

  <script>
  // ── Test harness ──
  const results = document.getElementById("results");
  let passed = 0, failed = 0;

  function assert(condition, name) {
    const div = document.createElement("div");
    div.className = "result";
    if (condition) {
      div.className += " pass";
      div.textContent = "PASS: " + name;
      passed++;
    } else {
      div.className += " fail";
      div.textContent = "FAIL: " + name;
      failed++;
    }
    results.appendChild(div);
  }

  // ── Minimal TypewriterRenderer for test isolation ──
  function createTypewriterRenderer() {
    let fullText = "";
    let displayedLength = 0;
    let charDelay = 30;
    let isRunning = false;
    let rafId = null;
    let lastTickTime = 0;
    let targetElement = null;
    let onRenderCallback = null;
    let startTime = 0;

    function tick(timestamp) {
      if (!isRunning) return;
      if (!lastTickTime) lastTickTime = timestamp;
      const elapsed = timestamp - lastTickTime;
      const queueElapsed = timestamp - startTime;
      const effectiveDelay = queueElapsed > 3000 ? 5 : charDelay;
      const batchSize = elapsed > 100 ? 5 : 1;
      if (elapsed >= effectiveDelay) {
        let charsRendered = 0;
        while (charsRendered < batchSize && displayedLength < fullText.length) {
          displayedLength++;
          charsRendered++;
        }
        if (targetElement) {
          targetElement.textContent = fullText.substring(0, displayedLength);
        }
        if (onRenderCallback) onRenderCallback();
        lastTickTime = timestamp;
      }
      if (displayedLength < fullText.length) {
        rafId = requestAnimationFrame(tick);
      } else {
        if (targetElement) targetElement.classList.remove("streaming-cursor");
        isRunning = false;
        rafId = null;
      }
    }

    function appendText(text) {
      try {
        if (typeof text !== "string") text = String(text ?? "");
        fullText += text;
        if (!isRunning) {
          startTime = performance.now();
          isRunning = true;
          lastTickTime = 0;
          if (targetElement) targetElement.classList.add("streaming-cursor");
          rafId = requestAnimationFrame(tick);
        }
      } catch (e) { flush(); }
    }

    function flush() {
      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
      try {
        displayedLength = fullText.length;
        if (targetElement) {
          targetElement.textContent = fullText;
          targetElement.classList.remove("streaming-cursor");
        }
      } catch (e) {}
      isRunning = false;
    }

    function stop() {
      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
      isRunning = false;
      if (targetElement) targetElement.classList.remove("streaming-cursor");
    }

    function reset() { stop(); fullText = ""; displayedLength = 0; charDelay = 30; lastTickTime = 0; startTime = 0; }
    function setTarget(el) { targetElement = el; }
    function setOnRender(cb) { onRenderCallback = cb; }
    function getIsRunning() { return isRunning; }
    function getFullText() { return fullText; }
    function getDisplayedLength() { return displayedLength; }

    return { appendText, flush, stop, reset, setTarget, setOnRender, getIsRunning, getFullText, getDisplayedLength };
  }

  // ── Minimal StepRenderer for test isolation ──
  function createStepRenderer() {
    const steps = new Map();
    let container = null;

    function createStep(stepId, label) {
      if (!container) return null;
      if (steps.has(stepId)) {
        const old = steps.get(stepId);
        if (old.element && old.element.parentNode) old.element.parentNode.removeChild(old.element);
        steps.delete(stepId);
      }
      const element = document.createElement("div");
      element.className = "streaming-step running";
      element.style.willChange = "transform, opacity";
      const iconSpan = document.createElement("span");
      iconSpan.className = "step-icon";
      iconSpan.innerHTML = '<span class="pulse-dot"></span>';
      const textSpan = document.createElement("span");
      textSpan.className = "step-text";
      textSpan.textContent = label;
      element.appendChild(iconSpan);
      element.appendChild(textSpan);
      container.appendChild(element);
      const entry = { stepId, status: "running", label, element };
      steps.set(stepId, entry);
      return entry;
    }

    function updateStep(stepId, status) {
      const entry = steps.get(stepId);
      if (!entry || !entry.element) return;
      const oldStatus = entry.status;
      if (oldStatus === status) return;
      const element = entry.element;
      const iconSpan = element.querySelector(".step-icon");
      if (!iconSpan) return;
      element.classList.remove(oldStatus);
      requestAnimationFrame(() => {
        element.classList.add(status);
        iconSpan.innerHTML = "";
        if (status === "running") {
          const dot = document.createElement("span");
          dot.className = "pulse-dot";
          iconSpan.appendChild(dot);
        } else if (status === "completed") {
          iconSpan.appendChild(document.createTextNode("✅"));
        } else if (status === "error") {
          iconSpan.appendChild(document.createTextNode("❌"));
        }
      });
      entry.status = status;
    }

    function clearSteps() {
      for (const [, entry] of steps) {
        if (entry.element && entry.element.parentNode) entry.element.parentNode.removeChild(entry.element);
      }
      steps.clear();
    }

    function setContainer(el) { container = el; }
    function getContainer() { return container; }
    function getStep(stepId) { return steps.get(stepId) || null; }
    function getStepCount() { return steps.size; }
    function hasStep(stepId) { return steps.has(stepId); }

    return { createStep, updateStep, clearSteps, setContainer, getContainer, getStep, getStepCount, hasStep };
  }

  // ── Global singletons for tests ──
  const typewriter = createTypewriterRenderer();
  const stepRenderer = createStepRenderer();

  // ── Functions under test ──
  // (These will be added to app.js; defined here for test isolation)

  function updatePhaseLabel(step) {
    const streamingEl = document.querySelector('article.message.assistant.streaming');
    if (!streamingEl) return;
    const meta = streamingEl.querySelector('.meta');
    if (!meta) return;

    if (step === 'thinking') {
      meta.textContent = 'DBAgent · 思考中...';
    } else if (step && step.startsWith('tool:')) {
      meta.textContent = 'DBAgent · 正在查询数据库...';
    } else {
      meta.textContent = 'DBAgent';
    }
  }

  function cleanupAnimations() {
    // Stop TypewriterRenderer
    typewriter.stop();

    // Clear step animation classes and will-change
    const streamingEl = document.querySelector('article.message.assistant.streaming');
    if (streamingEl) {
      const steps = streamingEl.querySelectorAll('.streaming-step');
      steps.forEach(step => {
        step.classList.remove('running');
        step.style.willChange = '';
      });

      // Remove will-change from all child elements
      streamingEl.querySelectorAll('[style*="will-change"]').forEach(el => {
        el.style.willChange = '';
      });

      // Restore .meta
      const meta = streamingEl.querySelector('.meta');
      if (meta) {
        meta.textContent = 'DBAgent';
      }
    }
  }

  // ── Helper: create a streaming bubble for testing ──
  function createTestStreamingBubble() {
    const testArea = document.getElementById("testArea");
    testArea.innerHTML = "";

    const article = document.createElement("article");
    article.className = "message assistant streaming";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "A";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "DBAgent";

    const body = document.createElement("div");
    body.className = "content";

    bubble.append(meta, body);
    article.append(avatar, bubble);
    testArea.appendChild(article);
    return article;
  }

  // ═══════════════════════════════════════════════════════════════════
  // TEST SUITE
  // ═══════════════════════════════════════════════════════════════════

  // ── Test Group 1: updatePhaseLabel ──

  // Test 1.1: thinking step sets correct label
  {
    const article = createTestStreamingBubble();
    updatePhaseLabel("thinking");
    const meta = article.querySelector(".meta");
    assert(meta.textContent === "DBAgent · 思考中...",
      "1.1 updatePhaseLabel('thinking') sets 'DBAgent · 思考中...'");
  }

  // Test 1.2: tool: step sets correct label
  {
    const article = createTestStreamingBubble();
    updatePhaseLabel("tool:query_database");
    const meta = article.querySelector(".meta");
    assert(meta.textContent === "DBAgent · 正在查询数据库...",
      "1.2 updatePhaseLabel('tool:query_database') sets 'DBAgent · 正在查询数据库...'");
  }

  // Test 1.3: any tool: prefix works
  {
    const article = createTestStreamingBubble();
    updatePhaseLabel("tool:describe_table");
    const meta = article.querySelector(".meta");
    assert(meta.textContent === "DBAgent · 正在查询数据库...",
      "1.3 updatePhaseLabel('tool:describe_table') also sets tool label");
  }

  // Test 1.4: default/other step restores label
  {
    const article = createTestStreamingBubble();
    // First set to thinking, then restore
    updatePhaseLabel("thinking");
    updatePhaseLabel("some_other_step");
    const meta = article.querySelector(".meta");
    assert(meta.textContent === "DBAgent",
      "1.4 updatePhaseLabel('some_other_step') restores 'DBAgent'");
  }

  // Test 1.5: no streaming element is safe
  {
    const testArea = document.getElementById("testArea");
    testArea.innerHTML = "";
    let threw = false;
    try { updatePhaseLabel("thinking"); } catch (e) { threw = true; }
    assert(!threw, "1.5 updatePhaseLabel with no streaming element does not throw");
  }

  // Test 1.6: transition thinking -> tool -> thinking
  {
    const article = createTestStreamingBubble();
    const meta = article.querySelector(".meta");

    updatePhaseLabel("thinking");
    assert(meta.textContent === "DBAgent · 思考中...",
      "1.6a transition to thinking");

    updatePhaseLabel("tool:run_sql");
    assert(meta.textContent === "DBAgent · 正在查询数据库...",
      "1.6b transition to tool");

    updatePhaseLabel("thinking");
    assert(meta.textContent === "DBAgent · 思考中...",
      "1.6c transition back to thinking");
  }

  // ── Test Group 2: cleanupAnimations ──

  // Test 2.1: cleanupAnimations stops typewriter
  {
    const article = createTestStreamingBubble();
    const body = article.querySelector(".content");
    const thinkingEl = document.createElement("div");
    thinkingEl.className = "thinking-text streaming-cursor";
    body.appendChild(thinkingEl);
    typewriter.setTarget(thinkingEl);
    typewriter.appendText("Hello World");
    // Typewriter should be running
    assert(typewriter.getIsRunning() === true, "2.1a typewriter is running before cleanup");

    cleanupAnimations();
    assert(typewriter.getIsRunning() === false, "2.1b cleanupAnimations stops typewriter");
    typewriter.reset();
  }

  // Test 2.2: cleanupAnimations clears step animation classes
  {
    const article = createTestStreamingBubble();
    const body = article.querySelector(".content");
    const stepsContainer = document.createElement("div");
    stepsContainer.className = "streaming-steps";
    body.appendChild(stepsContainer);
    stepRenderer.setContainer(stepsContainer);
    stepRenderer.createStep("tool:query", "query");
    stepRenderer.createStep("tool:run", "run");

    // Verify steps have 'running' class
    const steps = article.querySelectorAll(".streaming-step");
    let allRunning = true;
    steps.forEach(s => { if (!s.classList.contains("running")) allRunning = false; });
    assert(allRunning && steps.length === 2, "2.2a steps have 'running' class before cleanup");

    cleanupAnimations();
    let anyRunning = false;
    steps.forEach(s => { if (s.classList.contains("running")) anyRunning = true; });
    assert(!anyRunning, "2.2b steps no longer have 'running' class after cleanup");

    stepRenderer.clearSteps();
  }

  // Test 2.3: cleanupAnimations removes will-change
  {
    const article = createTestStreamingBubble();
    const body = article.querySelector(".content");
    const stepsContainer = document.createElement("div");
    stepsContainer.className = "streaming-steps";
    body.appendChild(stepsContainer);
    stepRenderer.setContainer(stepsContainer);
    stepRenderer.createStep("tool:test", "test");

    // Verify will-change is set
    const step = article.querySelector(".streaming-step");
    assert(step.style.willChange === "transform, opacity",
      "2.3a will-change is set on step before cleanup");

    cleanupAnimations();
    assert(step.style.willChange === "",
      "2.3b will-change is cleared after cleanup");

    stepRenderer.clearSteps();
  }

  // Test 2.4: cleanupAnimations restores .meta to "DBAgent"
  {
    const article = createTestStreamingBubble();
    const meta = article.querySelector(".meta");
    updatePhaseLabel("thinking");
    assert(meta.textContent !== "DBAgent", "2.4a meta is not 'DBAgent' before cleanup");

    cleanupAnimations();
    assert(meta.textContent === "DBAgent", "2.4b cleanupAnimations restores meta to 'DBAgent'");
  }

  // Test 2.5: cleanupAnimations is safe when no streaming element exists
  {
    const testArea = document.getElementById("testArea");
    testArea.innerHTML = "";
    let threw = false;
    try { cleanupAnimations(); } catch (e) { threw = true; }
    assert(!threw, "2.5 cleanupAnimations with no streaming element does not throw");
  }

  // ── Test Group 3: Integration - lifecycle wiring ──

  // Test 3.1: cleanupAnimations + typewriter.reset in switchSession pattern
  {
    const article = createTestStreamingBubble();
    const body = article.querySelector(".content");
    const thinkingEl = document.createElement("div");
    thinkingEl.className = "thinking-text streaming-cursor";
    body.appendChild(thinkingEl);
    typewriter.setTarget(thinkingEl);
    typewriter.appendText("Some text");

    const stepsContainer = document.createElement("div");
    stepsContainer.className = "streaming-steps";
    body.appendChild(stepsContainer);
    stepRenderer.setContainer(stepsContainer);
    stepRenderer.createStep("tool:test", "test");

    updatePhaseLabel("tool:test");

    // Simulate switchSession pattern
    cleanupAnimations();
    typewriter.reset();

    assert(typewriter.getIsRunning() === false, "3.1a switchSession pattern: typewriter stopped");
    assert(typewriter.getFullText() === "", "3.1b switchSession pattern: typewriter reset");
    assert(typewriter.getDisplayedLength() === 0, "3.1c switchSession pattern: displayedLength reset");

    const meta = article.querySelector(".meta");
    assert(meta.textContent === "DBAgent", "3.1d switchSession pattern: meta restored");

    stepRenderer.clearSteps();
  }

  // Test 3.2: cleanupAnimations + typewriter.reset in sendMessage pattern
  {
    const article = createTestStreamingBubble();
    const body = article.querySelector(".content");
    const thinkingEl = document.createElement("div");
    thinkingEl.className = "thinking-text streaming-cursor";
    body.appendChild(thinkingEl);
    typewriter.setTarget(thinkingEl);
    typewriter.appendText("Old text");

    updatePhaseLabel("thinking");

    // Simulate sendMessage entry pattern
    cleanupAnimations();
    typewriter.reset();

    assert(typewriter.getIsRunning() === false, "3.2a sendMessage pattern: typewriter stopped");
    assert(typewriter.getFullText() === "", "3.2b sendMessage pattern: typewriter reset");
    assert(typewriter.getDisplayedLength() === 0, "3.2c sendMessage pattern: displayedLength is 0");

    const meta = article.querySelector(".meta");
    assert(meta.textContent === "DBAgent", "3.2d sendMessage pattern: meta restored to DBAgent");
  }

  // Test 3.3: cleanupAnimations in finalizeStreamingMessage (normal path) pattern
  {
    const article = createTestStreamingBubble();
    const body = article.querySelector(".content");
    const thinkingEl = document.createElement("div");
    thinkingEl.className = "thinking-text streaming-cursor";
    body.appendChild(thinkingEl);
    typewriter.setTarget(thinkingEl);
    typewriter.appendText("Final text");

    const stepsContainer = document.createElement("div");
    stepsContainer.className = "streaming-steps";
    body.appendChild(stepsContainer);
    stepRenderer.setContainer(stepsContainer);
    stepRenderer.createStep("tool:final", "final");

    updatePhaseLabel("tool:final");

    // Simulate finalizeStreamingMessage(false) pattern
    cleanupAnimations();
    // Normal path: restore meta (already done by cleanup)
    const meta = article.querySelector(".meta");
    assert(meta.textContent === "DBAgent", "3.3a finalize normal: meta restored to DBAgent");
    assert(typewriter.getIsRunning() === false, "3.3b finalize normal: typewriter stopped");

    stepRenderer.clearSteps();
  }

  // Test 3.4: cleanupAnimations in finalizeStreamingMessage (cancelled path) pattern
  {
    const article = createTestStreamingBubble();
    const body = article.querySelector(".content");
    const thinkingEl = document.createElement("div");
    thinkingEl.className = "thinking-text streaming-cursor";
    body.appendChild(thinkingEl);
    typewriter.setTarget(thinkingEl);
    typewriter.appendText("Cancelled text");

    updatePhaseLabel("thinking");

    // Simulate finalizeStreamingMessage(true) pattern
    cleanupAnimations();
    // Cancelled path: animations stopped, meta restored
    assert(typewriter.getIsRunning() === false, "3.4a finalize cancelled: typewriter stopped");
    const meta = article.querySelector(".meta");
    assert(meta.textContent === "DBAgent", "3.4b finalize cancelled: meta restored to DBAgent");
  }

  // ── Print Summary ──
  function printSummary() {
    const total = passed + failed;
    const summary = document.createElement("h2");
    summary.textContent = passed + "/" + total + " passed";
    summary.style.color = failed === 0 ? "green" : "red";
    results.appendChild(summary);

    if (failed === 0) {
      document.body.setAttribute("data-test-result", "pass");
    } else {
      document.body.setAttribute("data-test-result", "fail");
    }
  }

  printSummary();
  </script>
</body>
</html>
