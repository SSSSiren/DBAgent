services:
  dbagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbagent
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dwai-data.dewu-inc.com/openai/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash-260425}
      - ONEDBA_BASE_URL=${ONEDBA_BASE_URL:-https://onedba.shizhuang-inc.com}
      - ONEDBA_ACCESS_TOKEN=${ONEDBA_ACCESS_TOKEN}
      - ONEDBA_ENV=${ONEDBA_ENV:-test}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-false}
    volumes:
      # 持久化数据
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s