<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBAgent</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="会话信息">
        <div class="brand">
          <div class="brand-mark">DB</div>
          <div>
            <h1>DBAgent</h1>
            <p>智能数据库助手</p>
          </div>
        </div>

        <section class="panel">
          <div class="panel-title">用户</div>
          <label for="userId">用户标识</label>
          <input id="userId" autocomplete="off" placeholder="输入用户标识…" />
          <div id="userIdStatus" class="status-line"></div>
        </section>

        <section class="panel session-panel">
          <div class="panel-title">会话</div>
          <button id="newSessionBtn" class="secondary" type="button" style="width:100%;margin-bottom:10px">+ 新建会话</button>
          <div id="sessionList" class="session-list">
            <div class="session-list-empty">请先设置用户标识</div>
          </div>
          <div id="sessionStatus" class="status-line">未加载</div>
        </section>

        <section class="panel">
          <div class="panel-title">快捷问题</div>
          <div class="quick-list">
            <button type="button" data-prompt="帮我看看 dw_onedba 相关的数据库">查 onedba 数据库</button>
            <button type="button" data-prompt="看看 dw_onedba 里有哪些表">查看表列表</button>
            <button type="button" data-prompt="描述一下 db_alert_history 表结构">查看表结构</button>
            <button type="button" data-prompt="查一下 db_alert_history 的总数">查询总数</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title">运行状态</div>
          <div id="runSteps" class="steps"></div>
        </section>

        <section class="panel sql-panel">
          <div class="panel-title"></div>
          <textarea id="latestSql" class="sql-box" rows="8" readonly placeholder="显示最新 SQL" wrap="soft"></textarea>
          <div class="sql-actions">
            <button id="copySqlBtn" class="secondary" type="button" disabled>复制 SQL</button>
            <span id="copySqlStatus" class="status-line" aria-live="polite"></span>
          </div>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <div class="eyebrow">ReAct Agent + OpenAI API</div>
            <h2>NL2SQL 数据探索</h2>
          </div>
          <div id="connectionBadge" class="badge">就绪</div>
        </header>

        <section id="messages" class="messages" aria-live="polite">
          <article class="message assistant">
            <div class="avatar">A</div>
            <div class="bubble">
              <div class="meta">DBAgent</div>
              <div class="content">
                请输入你的数据库问题。我会通过 ReAct Agent 规划步骤、调用 OneDBA 工具，并用表格或分析结论回复。
              </div>
            </div>
          </article>
        </section>

        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="2" placeholder="例如：帮我看看 dw_onedba 相关的数据库"></textarea>
          <div class="composer-actions">
            <button id="confirmBtn" class="secondary" type="button" disabled hidden>确认执行</button>
            <button id="sendBtn" type="submit">发送</button>
          </div>
        </form>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
